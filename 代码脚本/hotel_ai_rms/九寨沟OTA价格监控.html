<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>九寨沟 OTA 价格监控 | AI-RMS 收益驾驶舱</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  :root {
    --bg: #0a1628;
    --card: #142642;
    --border: #2a4a6d;
    --gold: #c8963e;
    --text: #d0d8e8;
    --muted: #8899bb;
    --green: #28a745;
    --red: #dc3545;
    --blue: #3b82f6;
    --orange: #f59e0b;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: linear-gradient(135deg, #0a1628 0%, #111d35 100%);
    color: var(--text);
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    min-height: 100vh;
  }

  .header {
    background: linear-gradient(90deg, #0d1f3c, #1a3a6b, #0d1f3c);
    border-bottom: 3px solid var(--gold);
    padding: 16px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .header h1 { color:#fff; font-size:22px; letter-spacing:2px; }
  .header .sub { color:var(--gold); font-size:12px; letter-spacing:3px; }
  .header .live-dot {
    display: inline-block; width:8px; height:8px; border-radius:50%;
    background: var(--green); margin-right:6px; animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .container { max-width:1500px; margin:0 auto; padding:14px 20px; }

  /* KPI cards */
  .kpi-row { display:flex; gap:12px; margin-bottom:14px; }
  .kpi-card {
    flex:1; background:var(--card); border:1px solid var(--border);
    border-radius:10px; padding:18px 20px;
    box-shadow:0 4px 15px rgba(0,0,0,0.3);
    position:relative; overflow:hidden;
  }
  .kpi-card::before {
    content:''; position:absolute; top:0; left:0; width:4px; height:100%;
  }
  .kpi-card.hotel::before { background:var(--blue); }
  .kpi-card.lowest::before { background:var(--green); }
  .kpi-card.avg::before { background:var(--gold); }
  .kpi-card.fresh::before { background:var(--orange); }
  .kpi-card .val { font-size:28px; font-weight:800; color:#fff; }
  .kpi-card .lbl { font-size:11px; color:var(--muted); margin-top:4px; letter-spacing:1px; }
  .kpi-card .sub-text { font-size:10px; color:var(--muted); margin-top:2px; }

  /* Controls */
  .controls {
    display:flex; gap:10px; flex-wrap:wrap; align-items:center;
    background:var(--card); border:1px solid var(--border);
    border-radius:10px; padding:12px 18px; margin-bottom:14px;
  }
  .btn {
    background: linear-gradient(135deg, #c8963e, #a67c2e);
    color:#0a1628; border:none; border-radius:6px; font-weight:700;
    font-size:13px; padding:8px 20px; cursor:pointer; letter-spacing:1px;
    transition: all 0.3s; white-space:nowrap;
  }
  .btn:hover { box-shadow:0 4px 15px rgba(200,150,62,0.4); transform:translateY(-1px); }
  .btn:disabled { opacity:0.5; cursor:not-allowed; }
  .btn-outline { background:transparent; color:var(--gold); border:1px solid var(--gold); }
  .btn-outline:hover { background:rgba(200,150,62,0.1); }
  .btn-green { background:linear-gradient(135deg, #28a745, #1e7e34); color:#fff; }
  .status-text { font-size:11px; color:var(--muted); margin-left:auto; }

  /* Chart grid */
  .chart-row { display:flex; gap:12px; margin-bottom:14px; }
  .chart-box {
    flex:1; background:var(--card); border:1px solid var(--border);
    border-radius:10px; padding:14px; min-height:340px;
  }
  .chart-box.full { flex:none; width:100%; }
  .chart-box h3 { color:var(--gold); font-size:14px; margin-bottom:8px; letter-spacing:1px; }
  .chart-inner { width:100%; height:300px; }

  /* Table */
  .section-title {
    font-size:16px; font-weight:700; color:var(--gold);
    border-bottom:2px solid var(--gold); padding-bottom:6px; margin:16px 0 10px;
    letter-spacing:1px;
  }
  .table-wrap { overflow-x:auto; max-height:420px; overflow-y:auto; border-radius:10px; }
  table {
    width:100%; border-collapse:separate; border-spacing:0;
    background:var(--card); border:1px solid var(--border); font-size:12px;
  }
  thead th {
    background:#0d1f3c; color:var(--gold); font-weight:700;
    padding:10px; text-align:left; position:sticky; top:0;
    border-bottom:2px solid var(--border); cursor:pointer; user-select:none;
  }
  tbody td { padding:9px 10px; border-bottom:1px solid rgba(42,74,109,0.3); }
  tbody tr:hover { background:rgba(200,150,62,0.05); }
  tbody tr:last-child td { border-bottom:none; }
  .price-lowest { color:var(--green); font-weight:700; }
  .badge {
    display:inline-block; padding:2px 8px; border-radius:10px;
    font-size:10px; font-weight:700;
  }
  .badge-best { background:rgba(40,167,69,0.2); color:#28a745; border:1px solid #28a745; }

  /* Toast */
  .toast {
    position:fixed; top:20px; right:20px; z-index:9999;
    padding:12px 22px; border-radius:8px; font-weight:700;
    animation:fadeIn 0.4s ease; font-size:13px;
  }
  .toast-success { background:#1a3a2a; border:1px solid #28a745; color:#28a745; }
  .toast-error { background:#3a1a1a; border:1px solid #dc3545; color:#dc3545; }
  .toast-info { background:#1a2a3a; border:1px solid #3b82f6; color:#3b82f6; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(-10px);} to{opacity:1;transform:translateY(0);} }

  /* spinner */
  .spinner {
    display:inline-block; width:14px; height:14px; border:2px solid var(--border);
    border-top-color:var(--gold); border-radius:50%; animation:spin 0.6s linear infinite;
    vertical-align:middle; margin-right:6px;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  @media (max-width:1000px) {
    .kpi-row, .chart-row { flex-wrap:wrap; }
    .kpi-card, .chart-box { min-width:45%; }
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>🏔️ 九寨沟 · OTA 价格监控驾驶舱</h1>
    <div class="sub">携程CDP真实价格 · 竞品情报 · 收益决策</div>
  </div>
  <div style="text-align:right;">
    <div style="font-size:12px;color:var(--muted);"><span class="live-dot"></span><span id="headerTime">--</span></div>
    <div style="font-size:10px;color:var(--muted);" id="headerStatus">等待数据...</div>
  </div>
</div>

<div class="container">

  <!-- KPI 卡片 -->
  <div class="kpi-row" id="kpiRow">
    <div class="kpi-card hotel"><div class="val" id="kpiHotels">--</div><div class="lbl">监控酒店</div><div class="sub-text">携程CDP实时采集</div></div>
    <div class="kpi-card lowest"><div class="val" id="kpiLowest">--</div><div class="lbl">全网最低价</div><div class="sub-text" id="kpiLowestHotel">--</div></div>
    <div class="kpi-card avg"><div class="val" id="kpiAvg">--</div><div class="lbl">均价</div><div class="sub-text" id="kpiSpread">--</div></div>
    <div class="kpi-card fresh"><div class="val" id="kpiFresh">--</div><div class="lbl">数据时间</div><div class="sub-text" id="kpiRecords">--</div></div>
  </div>

  <!-- 控制栏 -->
  <div class="controls">
    <button class="btn" onclick="refreshAll()" id="refreshBtn">🔄 刷新数据</button>
    <button class="btn btn-green" onclick="triggerScrape()" id="scrapeBtn">🚀 实时采集</button>
    <button class="btn btn-outline" onclick="toggleAutoRefresh()" id="autoBtn">⏱ 自动刷新: 关</button>
    <button class="btn btn-outline" onclick="exportCSV()">📥 导出CSV</button>
    <span class="status-text" id="statusText">就绪</span>
  </div>

  <!-- 图表行 1: 价格对比 + 趋势 -->
  <div class="chart-row">
    <div class="chart-box">
      <h3>📊 酒店价格对比（最低 / 均价 / 最高）</h3>
      <div class="chart-inner" id="chartCompare"></div>
    </div>
    <div class="chart-box">
      <h3>📈 近7日价格趋势</h3>
      <div class="chart-inner" id="chartTrend"></div>
    </div>
  </div>

  <!-- 图表行 2: 房型分布 + 价格热力 -->
  <div class="chart-row">
    <div class="chart-box">
      <h3>🏨 各酒店房型价格分布</h3>
      <div class="chart-inner" id="chartRooms"></div>
    </div>
    <div class="chart-box">
      <h3>🔥 竞对价格矩阵</h3>
      <div class="chart-inner" id="chartMatrix"></div>
    </div>
  </div>

  <!-- 价格明细表 -->
  <div class="section-title">📋 携程实时价格明细 <span style="color:var(--muted);font-size:12px;font-weight:400;">（点击表头排序）</span></div>
  <div class="table-wrap" id="tableContainer"></div>

</div>

<div id="toastContainer"></div>

<script>
// ═══════════════════════════════════════════════════════
// 全局状态
// ═══════════════════════════════════════════════════════
const HOTEL_COLORS = {
  '九寨沟诺富特酒店': '#3b82f6',
  '九寨沟万怡酒店': '#f59e0b',
  '九寨沟德尔塔酒店': '#8b5cf6',
  '全季酒店九寨沟九寨大道店': '#10b981',
};
let dashboardData = null;
let autoTimer = null;
let sortCol = -1, sortAsc = true;

// ═══════════════════════════════════════════════════════
// 初始化
// ═══════════════════════════════════════════════════════
window.addEventListener('DOMContentLoaded', () => {
  refreshAll();
  // 响应式图表
  window.addEventListener('resize', () => {
    ['chartCompare','chartTrend','chartRooms','chartMatrix'].forEach(id => {
      const dom = document.getElementById(id);
      if (dom) { const inst = echarts.getInstanceByDom(dom); if (inst) inst.resize(); }
    });
  });
});

function updateTime() {
  document.getElementById('headerTime').textContent = new Date().toLocaleString('zh-CN');
}
setInterval(updateTime, 1000);
updateTime();

// ═══════════════════════════════════════════════════════
// 数据获取
// ═══════════════════════════════════════════════════════
async function fetchDashboard() {
  try {
    const resp = await fetch('/api/dashboard');
    if (resp.ok) {
      dashboardData = await resp.json();
      document.getElementById('headerStatus').innerHTML =
        '<span style="color:#28a745;">🟢 后端在线</span> · ' +
        (dashboardData.health?.last_fetch || '--');
      return dashboardData;
    }
  } catch(e) { console.log('API不可用:', e.message); }

  // 降级：尝试 /api/prices
  try {
    const resp = await fetch('/api/prices');
    if (resp.ok) {
      const result = await resp.json();
      dashboardData = { hotels: [], trends: {}, health: {}, raw: result };
      document.getElementById('headerStatus').innerHTML =
        '<span style="color:#f0c040;">⚠️ 降级模式</span>';
      return dashboardData;
    }
  } catch(e) {}

  document.getElementById('headerStatus').innerHTML =
    '<span style="color:#dc3545;">🔴 后端离线</span> · 运行 python server.py';
  return null;
}

async function refreshAll() {
  const btn = document.getElementById('refreshBtn');
  btn.innerHTML = '<span class="spinner"></span>加载中';
  btn.disabled = true;
  document.getElementById('statusText').textContent = '加载中...';

  const data = await fetchDashboard();
  if (data) {
    renderKPIs(data);
    renderCharts(data);
    renderTable(data);
    document.getElementById('statusText').textContent =
      '更新于 ' + new Date().toLocaleTimeString('zh-CN');
  } else {
    document.getElementById('statusText').textContent = '连接失败';
    showToast('⚠️ 后端未连接，请运行 python server.py', 'error');
  }

  btn.innerHTML = '🔄 刷新数据';
  btn.disabled = false;
}

async function triggerScrape() {
  const btn = document.getElementById('scrapeBtn');
  btn.innerHTML = '<span class="spinner"></span>采集中';
  btn.disabled = true;
  document.getElementById('statusText').textContent = 'Chrome CDP 采集中...';

  try {
    const resp = await fetch('/api/refresh');
    if (resp.ok) {
      const result = await resp.json();
      showToast('✅ 采集完成: ' + result.count + '条记录', 'success');
    }
  } catch(e) {
    showToast('❌ 采集失败', 'error');
  }

  await refreshAll();
  btn.innerHTML = '🚀 实时采集';
  btn.disabled = false;
}

// ═══════════════════════════════════════════════════════
// KPI 卡片
// ═══════════════════════════════════════════════════════
function renderKPIs(data) {
  const hotels = data.hotels || [];
  const hotelCount = hotels.length || 4;

  let allPrices = [];
  hotels.forEach(h => {
    if (h.min_price) allPrices.push(h.min_price);
  });
  if (!allPrices.length) allPrices = [331, 357, 358, 497];

  const lowest = Math.min(...allPrices);
  const avg = Math.round(allPrices.reduce((a,b)=>a+b,0) / allPrices.length);
  const spread = Math.max(...allPrices) - lowest;
  const lowestHotel = hotels.find(h => h.min_price === lowest);

  document.getElementById('kpiHotels').textContent = hotelCount;
  document.getElementById('kpiLowest').textContent = '¥' + lowest;
  document.getElementById('kpiLowestHotel').textContent = lowestHotel ? lowestHotel.hotel_name : '--';
  document.getElementById('kpiAvg').textContent = '¥' + avg;
  document.getElementById('kpiSpread').textContent = '价差 ¥' + spread;
  document.getElementById('kpiFresh').textContent = data.health?.last_fetch || '--';
  document.getElementById('kpiRecords').textContent =
    (data.health?.total_records || '--') + ' 条历史记录';
}

// ═══════════════════════════════════════════════════════
// ECharts 图表
// ═══════════════════════════════════════════════════════
function getChartDom(id) {
  const dom = document.getElementById(id);
  let inst = echarts.getInstanceByDom(dom);
  if (inst) inst.dispose();
  return echarts.init(dom, 'dark');
}

const textColor = '#8899bb';
const axisCommon = { axisLine:{lineStyle:{color:'#2a4a6d'}}, axisTick:{show:false},
  axisLabel:{color:textColor,fontSize:10}, splitLine:{lineStyle:{color:'rgba(42,74,109,0.3)'}} };

function renderCharts(data) {
  renderCompareChart(data);
  renderTrendChart(data);
  renderRoomChart(data);
  renderMatrixChart(data);
}

// 图表1: 酒店价格对比
function renderCompareChart(data) {
  const hotels = data.hotels || [];
  if (!hotels.length) return;

  const chart = getChartDom('chartCompare');
  const names = hotels.map(h => h.hotel_name.replace('九寨沟','').replace('酒店',''));
  const mins = hotels.map(h => h.min_price);
  const avgs = hotels.map(h => h.avg_price);
  const maxs = hotels.map(h => h.max_price);
  const colors = hotels.map(h => HOTEL_COLORS[h.hotel_name] || '#c8963e');

  chart.setOption({
    tooltip: { trigger:'axis', axisPointer:{type:'shadow'},
      formatter: p => {
        let s = '<b>' + hotels[p[0].dataIndex].hotel_name + '</b><br/>';
        p.forEach(item => { s += item.marker + ' ' + item.seriesName + ': ¥' + item.value + '<br/>'; });
        return s;
      }
    },
    legend: { data:['最低价','均价','最高价'], textStyle:{color:textColor,fontSize:10}, top:5 },
    grid: { left:'10%', right:'5%', top:'15%', bottom:'10%' },
    xAxis: { type:'category', data:names, axisLabel:{color:textColor,fontSize:10,rotate:15},
      axisLine:{lineStyle:{color:'#2a4a6d'}} },
    yAxis: { type:'value', name:'¥', ...axisCommon },
    series: [
      { name:'最低价', type:'bar', data:mins, itemStyle:{borderRadius:[4,4,0,0]},
        label:{show:true,position:'inside',fontSize:10,formatter:'¥{c}'} },
      { name:'均价', type:'bar', data:avgs, itemStyle:{color:'#f59e0b',borderRadius:[4,4,0,0]},
        label:{show:true,position:'inside',fontSize:9,formatter:'¥{c}'} },
      { name:'最高价', type:'bar', data:maxs, itemStyle:{color:'#ef4444',borderRadius:[4,4,0,0]},
        label:{show:true,position:'top',fontSize:9,formatter:'¥{c}',color:textColor} },
    ]
  });
}

// 图表2: 近7日趋势
function renderTrendChart(data) {
  const trends = data.trends || {};
  const chart = getChartDom('chartTrend');
  const hotelNames = Object.keys(trends);

  if (!hotelNames.length) {
    // 无历史数据时显示提示
    chart.setOption({
      title: { text:'暂无历史趋势数据', left:'center', top:'center',
        textStyle:{color:textColor,fontSize:14} },
    });
    return;
  }

  const series = hotelNames.map(name => ({
    name: name.replace('九寨沟','').replace('酒店',''),
    type: 'line',
    data: (trends[name] || []).map(d => d.min_price),
    smooth: true,
    symbol: 'circle',
    symbolSize: 6,
    lineStyle: { width:2 },
    itemStyle: { color: HOTEL_COLORS[name] || '#c8963e' },
  }));

  // 取第一个酒店的日期作为x轴
  const dates = (trends[hotelNames[0]] || []).map(d => d.fetch_date);

  chart.setOption({
    tooltip: { trigger:'axis',
      formatter: p => {
        let s = '<b>' + p[0].axisValue + '</b><br/>';
        p.forEach(item => { s += item.marker + ' ' + item.seriesName + ': ¥' + item.value + '<br/>'; });
        return s;
      }
    },
    legend: { data: series.map(s=>s.name), textStyle:{color:textColor,fontSize:9}, top:5, type:'scroll' },
    grid: { left:'8%', right:'5%', top:'18%', bottom:'8%' },
    xAxis: { type:'category', data:dates, ...axisCommon },
    yAxis: { type:'value', name:'¥', ...axisCommon },
    series: series,
  });
}

// 图表3: 房型价格分布（散点/气泡）
function renderRoomChart(data) {
  const hotels = data.hotels || [];
  const chart = getChartDom('chartRooms');

  if (!hotels.length) return;

  // 构建房型数据：从 raw API 或 hotels 数组
  const allRooms = [];
  if (data.raw && data.raw.data) {
    const roomMap = {};
    data.raw.data.forEach(r => {
      const key = r['酒店名称'] + '|' + r['房型'];
      if (!roomMap[key] || r['单价_晚'] < roomMap[key].price) {
        roomMap[key] = { hotel: r['酒店名称'], room: r['房型'], price: r['单价_晚'] };
      }
    });
    Object.values(roomMap).forEach(r => allRooms.push(r));
  }

  // 按酒店分组
  const hotelGroups = {};
  allRooms.forEach(r => {
    if (!hotelGroups[r.hotel]) hotelGroups[r.hotel] = [];
    hotelGroups[r.hotel].push(r);
  });

  const names = Object.keys(hotelGroups);
  if (!names.length) return;  // 无房型数据，跳过渲染
  const maxRoomCount = Math.max(...names.map(n => (hotelGroups[n] || []).length), 1);
  const series = names.map((name, i) => ({
    name: name.replace('九寨沟','').replace('酒店',''),
    type: 'bar',
    data: hotelGroups[name].map(r => r.price),
    itemStyle: { color: HOTEL_COLORS[name] || '#c8963e', borderRadius:[3,3,0,0] },
    label: { show: true, position:'top', fontSize:8, color:textColor,
      formatter: p => hotelGroups[name][p.dataIndex].room.length > 8
        ? hotelGroups[name][p.dataIndex].room.slice(0,8)+'…' : hotelGroups[name][p.dataIndex].room },
    emphasis: { itemStyle:{shadowBlur:10,shadowColor:'rgba(0,0,0,0.5)'} },
  }));

  chart.setOption({
    tooltip: { trigger:'axis',
      formatter: p => {
        const hotel = names[p[0].dataIndex];
        const r = hotelGroups[hotel][p[0].dataIndex];
        return '<b>' + hotel + '</b><br/>' + r.room + '<br/>¥' + r.price;
      }
    },
    legend: { data: series.map(s=>s.name), textStyle:{color:textColor,fontSize:9}, top:5, type:'scroll' },
    grid: { left:'5%', right:'5%', top:'18%', bottom:'15%' },
    xAxis: { type:'category', data: [...Array(maxRoomCount)].map((_, i) => '#' + (i + 1)),
      name:'房型序号', ...axisCommon },
    yAxis: { type:'value', name:'¥', ...axisCommon },
    series: series,
  });
}

// 图表4: 竞对价格矩阵（热力图）
function renderMatrixChart(data) {
  const hotels = data.hotels || [];
  const chart = getChartDom('chartMatrix');

  if (!hotels.length) return;

  // 构建矩阵数据: 行=酒店, 列=价格段(最低/均价/最高/房型数)
  const xLabels = ['最低价', '均价', '最高价', '房型数'];
  const yLabels = hotels.map(h => h.hotel_name.replace('九寨沟','').replace('酒店',''));
  const matrixData = [];
  const priceMax = Math.max(...hotels.map(h => h.max_price), 1);

  hotels.forEach((h, yi) => {
    matrixData.push([0, yi, h.min_price]);
    matrixData.push([1, yi, h.avg_price]);
    matrixData.push([2, yi, h.max_price]);
    matrixData.push([3, yi, h.room_types]);
  });

  chart.setOption({
    tooltip: {
      formatter: p => {
        const h = hotels[p.data[1]];
        const col = ['最低价','均价','最高价','房型数'][p.data[0]];
        return '<b>' + h.hotel_name + '</b><br/>' + col + ': ' +
          (p.data[0] === 3 ? p.data[2] + '种' : '¥' + p.data[2]);
      }
    },
    grid: { left:'18%', right:'8%', top:'6%', bottom:'8%' },
    xAxis: { type:'category', data:xLabels, position:'top', ...axisCommon },
    yAxis: { type:'category', data:yLabels, ...axisCommon },
    visualMap: {
      min: 0, max: priceMax,
      calculable: true,
      orient:'vertical', right:5, top:'center',
      textStyle:{color:textColor},
      inRange: { color: ['#0d1f3c', '#1a3a6b', '#c8963e', '#f59e0b'] }
    },
    series: [{
      type: 'heatmap',
      data: matrixData,
      label: { show:true, fontSize:11, fontWeight:'bold',
        formatter: p => p.data[0] === 3 ? p.data[2]+'种' : '¥'+p.data[2] },
      emphasis: { itemStyle:{shadowBlur:10,shadowColor:'rgba(0,0,0,0.5)'} },
    }]
  });
}

// ═══════════════════════════════════════════════════════
// 价格明细表
// ═══════════════════════════════════════════════════════
function renderTable(data) {
  let rows = [];
  // 优先用 raw API 数据（含房型明细），否则用 hotels 摘要
  if (data.raw && data.raw.data) {
    rows = data.raw.data.map(r => ({
      hotel: r['酒店名称'],
      star: r['星级'] || inferStar(r['酒店名称']),
      room: r['房型'] || '标准房',
      platform: r['OTA平台'] || '携程',
      price: r['单价_晚'],
      source: r['数据来源'] || '',
      breakfast: r['含早'] || '--',
      cancel: r['可取消'] || '--',
    }));
  } else {
    const hotels = data.hotels || [];
    hotels.forEach(h => {
      rows.push({
        hotel: h.hotel_name, star: inferStar(h.hotel_name),
        room: '最低房型', platform: '携程', price: h.min_price,
        source: '携程真实', breakfast: '--', cancel: '--',
      });
    });
  }

  if (!rows.length) {
    document.getElementById('tableContainer').innerHTML =
      '<div style="padding:40px;text-align:center;color:var(--muted);">暂无数据，点击"实时采集"获取价格</div>';
    return;
  }

  // 排序
  if (sortCol >= 0) {
    const keys = ['hotel','star','room','platform','price','source','breakfast','cancel'];
    const key = keys[sortCol];
    rows.sort((a,b) => {
      if (typeof a[key] === 'number') return sortAsc ? a[key]-b[key] : b[key]-a[key];
      return sortAsc ? String(a[key]).localeCompare(String(b[key])) : String(b[key]).localeCompare(String(a[key]));
    });
  }

  // 找出每个酒店最低价
  const hotelMins = {};
  rows.forEach(r => { if (!hotelMins[r.hotel] || r.price < hotelMins[r.hotel]) hotelMins[r.hotel] = r.price; });

  const headerClick = (idx, label) =>
    `<th onclick="sortTable(${idx})">${label} ${sortCol===idx ? (sortAsc?'▲':'▼') : ''}</th>`;

  let html = `<table>
  <thead><tr>
    ${headerClick(0,'酒店名称')} ${headerClick(1,'星级')} ${headerClick(2,'房型')}
    ${headerClick(3,'平台')} ${headerClick(4,'单价/晚')} ${headerClick(5,'来源')}
    <th>含早</th><th>取消</th><th>标记</th>
  </tr></thead><tbody>`;

  rows.forEach(r => {
    const isLowest = r.price === hotelMins[r.hotel];
    const starStr = '⭐'.repeat(r.star);
    html += `<tr>
      <td><b>${r.hotel}</b></td>
      <td>${starStr}</td>
      <td>${r.room.length > 20 ? r.room.slice(0,20)+'…' : r.room}</td>
      <td>${r.platform}</td>
      <td class="${isLowest ? 'price-lowest' : ''}">¥${r.price}</td>
      <td>${r.source}</td>
      <td>${r.breakfast === '是' ? '🍳' : '--'}</td>
      <td>${r.cancel === '是' ? '✅' : '--'}</td>
      <td>${isLowest ? '<span class="badge badge-best">最低</span>' : ''}</td>
    </tr>`;
  });

  html += '</tbody></table>';
  document.getElementById('tableContainer').innerHTML = html;
}

function inferStar(name) {
  if (name.includes('德尔塔')) return 5;
  if (name.includes('诺富特') || name.includes('万怡')) return 4;
  if (name.includes('全季')) return 3;
  return 4;
}

function sortTable(col) {
  if (sortCol === col) sortAsc = !sortAsc; else { sortCol = col; sortAsc = true; }
  if (dashboardData) renderTable(dashboardData);
}

// ═══════════════════════════════════════════════════════
// CSV导出
// ═══════════════════════════════════════════════════════
function exportCSV() {
  if (!dashboardData) return showToast('⚠️ 无数据可导出', 'error');

  let rows = [];
  if (dashboardData.raw && dashboardData.raw.data) {
    rows = dashboardData.raw.data;
  } else if (dashboardData.hotels) {
    rows = dashboardData.hotels.map(h => ({
      '酒店名称': h.hotel_name, 'OTA平台': '携程', '房型': '标准房',
      '单价_晚': h.min_price, '数据来源': '携程真实',
    }));
  }

  if (!rows.length) return showToast('⚠️ 无数据可导出', 'error');

  const headers = Object.keys(rows[0]);
  const csvLines = [headers.join(',')];
  rows.forEach(r => {
    csvLines.push(headers.map(k => {
      const v = r[k] !== undefined ? r[k] : '';
      return String(v).includes(',') ? '"' + v + '"' : v;
    }).join(','));
  });

  const blob = new Blob(['﻿' + csvLines.join('\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '九寨沟OTA价格_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('📥 CSV已导出', 'info');
}

// ═══════════════════════════════════════════════════════
// 自动刷新
// ═══════════════════════════════════════════════════════
function toggleAutoRefresh() {
  const btn = document.getElementById('autoBtn');
  if (autoTimer) {
    clearInterval(autoTimer); autoTimer = null;
    btn.textContent = '⏱ 自动刷新: 关';
    btn.classList.remove('btn-green'); btn.classList.add('btn-outline');
    showToast('自动刷新已关闭', 'info');
  } else {
    autoTimer = setInterval(refreshAll, 60000);
    btn.textContent = '⏱ 自动刷新: 开 (60s)';
    btn.classList.remove('btn-outline'); btn.classList.add('btn-green');
    showToast('🔁 每60秒自动刷新', 'success');
  }
}

// ═══════════════════════════════════════════════════════
// Toast
// ═══════════════════════════════════════════════════════
function showToast(msg, type) {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast toast-' + type;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => { t.style.opacity='0'; setTimeout(()=>t.remove(),400); }, 2500);
}
</script>
