# =============================================================================
# 九寨沟 OTA 价格监控 — 酒店配置
# =============================================================================
# 用途：集中管理目标酒店列表、携程ID映射、平台偏差参数
# 修改此文件后无需重启服务，下次采集自动生效
# =============================================================================

# ── 采集全局设置 ──
scraper:
  # 默认入住/离店日期（相对今天偏移天数）
  default_checkin_offset: 7    # 7天后入住
  default_checkout_offset: 8   # 8天后离店

  # Chrome CDP 设置
  chrome:
    port: 9222
    exe: "C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe"
    user_data_dir: "E:\\工作AI\\代码脚本\\hotel_ai_rms\\chrome_cdp_profile"
    # 健康检查端点
    health_url: "http://127.0.0.1:9222/json/version"
    # 启动超时（秒）
    startup_timeout: 15
    # 无响应后强制重启前等待（秒）
    hang_timeout: 120
    # 心跳间隔（秒）
    heartbeat_interval: 30

  # 反爬策略
  anti_bot:
    # 每采集N家后重启Chrome
    batch_restart_every: 3
    # 页面间延迟（秒）
    page_delay_min: 15
    page_delay_max: 25
    # 批量重启冷却（秒）
    restart_cooldown: 5
    # 单酒店最大重试次数
    max_retries: 2

  # 采集超时（秒）
  timeouts:
    page_load: 30
    api_wait: 15
    total_per_hotel: 90

  # 缓存设置
  cache:
    ttl_seconds: 300      # API缓存5分钟
    force_refresh_hour: 9 # 每日强制刷新时间

