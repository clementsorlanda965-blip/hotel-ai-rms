# ── OTA 平台参数 ──
platforms:
  - name: "携程"
    commission: 0.15
    price_bias: 1.00
    color: "#0066cc"
  - name: "美团"
    commission: 0.12
    price_bias: 0.97
    color: "#ffc700"
  - name: "飞猪"
    commission: 0.10
    price_bias: 0.95
    color: "#ff5000"
  - name: "去哪儿"
    commission: 0.13
    price_bias: 0.93
    color: "#1976d2"
  - name: "同程"
    commission: 0.11
    price_bias: 0.96
    color: "#07c160"
  - name: "艺龙"
    commission: 0.14
    price_bias: 0.98
    color: "#e60044"

# ── 告警阈值 ──
alerts:
  # 竞对降价告警：单酒店降价超过此比例触发
  competitor_price_drop_pct: 15
  # 采集连续失败N次触发告警
  scraper_consecutive_failures: 3
  # Chrome CDP 无响应超时（秒）
  chrome_hang_timeout: 120
  # 每日最晚采集完成时间（超过则告警）
  daily_scrape_deadline_hour: 10

# ── 通知渠道 ──
notifications:
  feishu:
    enabled: true
    # webhook URL 通过环境变量 FEISHU_RMS_ALERT_WEBHOOK 设置
    # 或通过 feishu-mcp / lark-im 发送
    webhook_env: "FEISHU_RMS_ALERT_WEBHOOK"
  # 本地日志文件
  log_file: "E:\\工作AI\\临时文件\\ota_scraper_service.log"
  log_max_mb: 50
  log_backup_count: 5
